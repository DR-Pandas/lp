<!DOCTYPE html>
<html>
<head>
    <title>Simple jQuery Mobile Website</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <!-- jQuery Mobile JS -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>

<body>

<!-- HOME PAGE -->
<div data-role="page" id="home">

    <div data-role="header">
        <h1>College Website</h1>
    </div>

    <div data-role="navbar">
        <ul>
            <li><a href="#home" class="ui-btn-active">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#dept">Dept</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <div data-role="content">
        <h3>Welcome to College Website</h3>
        <p>This is a simple mobile website using jQuery Mobile.</p>
    </div>

    <div data-role="footer">
        <h4>Footer</h4>
    </div>

</div>

<!-- ABOUT PAGE -->
<div data-role="page" id="about">

    <div data-role="header">
        <h1>About</h1>
    </div>

    <div data-role="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about" class="ui-btn-active">About</a></li>
            <li><a href="#dept">Dept</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>

    <div data-role="content">
        <p>This is About Page.</p>
    </div>

</div>

<!-- DEPARTMENT PAGE -->
<div data-role="page" id="dept">

    <div data-role="header">
        <h1>Department</h1>
    </div>

    <div data-role="content">
        <ul data-role="listview">
            <li>Computer</li>
            <li>IT</li>
            <li>Mechanical</li>
            <li>Civil</li>
        </ul>
    </div>

</div>

<!-- CONTACT PAGE -->
<div data-role="page" id="contact">

    <div data-role="header">
        <h1>Contact</h1>
    </div>

    <div data-role="content">

        <form>
            <label>Name:</label>
            <input type="text" id="name">

            <label>Email:</label>
            <input type="email" id="email">

            <label>Mobile:</label>
            <input type="text" id="mobile">

            <button>Submit</button>
        </form>

    </div>

</div>

</body>
</html>
